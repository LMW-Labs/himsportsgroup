<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Back Shortly | Hyche International Management Sports Group</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&family=Rajdhani:wght@600&display=swap" rel="stylesheet" />
  <!-- Fully self-contained on purpose: this page must render even when the
       database, build pipeline, or the rest of the site is broken. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0A0C10;
      color: #A8BDD0;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }
    .glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 45% at 50% 35%, rgba(26,114,232,0.18), transparent 70%),
        radial-gradient(ellipse 40% 30% at 50% 90%, rgba(200,80,16,0.12), transparent 70%);
      pointer-events: none;
    }
    main {
      position: relative;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .logo { height: 72px; width: auto; margin: 0 auto 36px; display: block; }
    .eyebrow {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #C85010;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-weight: 400;
      font-size: clamp(2.8rem, 9vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: 0.02em;
      color: #D8E8F4;
      margin-bottom: 20px;
    }
    p { font-size: clamp(1rem, 2.5vw, 1.1rem); line-height: 1.6; }
    .bar {
      width: 64px;
      height: 3px;
      background: #1A72E8;
      margin: 32px auto;
      border-radius: 2px;
    }
    a { color: #1A72E8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .small { font-size: 0.85rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <img class="logo" src="/logo.png" alt="Hyche International Management Sports Group" onerror="this.style.display='none'" />
    <p class="eyebrow">Timeout Called</p>
    <h1>We'll Be Right Back</h1>
    <p>We're making a few updates to the site. Everything will be back in the game shortly.</p>
    <div class="bar" aria-hidden="true"></div>
    <p class="small">Athletes, brands, and media: thanks for your patience. Please check back soon.</p>
  </main>
</body>
</html>
